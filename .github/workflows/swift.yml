# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: |
        if [ -f Package.swift ]; then
          swift build -v
        else
          echo "Skipping Swift build: no Package.swift found."
        fi
    - name: Run tests
      run: |
        if [ -f Package.swift ]; then
          swift test -v
        else
          echo "Skipping Swift tests: no Package.swift found."
        fi
